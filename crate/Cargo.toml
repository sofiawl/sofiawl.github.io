[package]
name = "physarum"
version = "1.1.0"
edition = "2021"
description = "A slime mold that routes a personal website: Tero's Physarum solver (brain) + Jones agents (body), compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
