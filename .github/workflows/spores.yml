# Release spores: when a Markdown file in spores/ changes, rebuild the blog
# pages and web/spores/index.json and commit them.
name: spores
on:
  push:
    paths: ["spores/**", "web/index.html", "tools/spores.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/spores.py && cp web/index.html web/404.html
      - name: Commit
        run: |
          git config user.name "spores-bot"
          git config user.email "spores-bot@users.noreply.github.com"
          git add web
          git diff --cached --quiet || (git commit -m "spores: release" && git push)
