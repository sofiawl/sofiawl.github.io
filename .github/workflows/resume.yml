# Rebuild the résumé PDF whenever resume/resume.tex changes, and commit it
# into web/files/ so the site's "Download PDF" button is always current.
name: résumé
on:
  push:
    paths: ["resume/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Build
        run: ./resume/build.sh
      - name: Commit PDF
        run: |
          git config user.name "resume-bot"
          git config user.email "resume-bot@users.noreply.github.com"
          git add web/files
          git diff --cached --quiet || git commit -m "résumé: rebuild PDF" && git push
